name: Post YouTube Shorts

on:
  schedule:
    - cron: '0 * * * *'      # every hour — the best-time check below decides if it actually posts
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot label for this manual run (cosmetic only)'
        required: false
        default: '0'

jobs:
  post-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_FILE: client_secrets.json
      YOUTUBE_TOKEN_FILE: youtube_token.json
      MADE_FOR_KIDS: "false"
      GEMINI_TTS_VOICE: "Charon"
      TREND_REGION: "US"
      AUDIENCE_TIMEZONE: "America/New_York"
      INSTAGRAM_ENABLED: "true"
      FACEBOOK_ENABLED: "true"
      IG_THUMB_OFFSET_MS: "2000"
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if now is a good time to post
        id: besttime
        run: |
          RESULT=$(python3 scripts/should_post_now.py)
          echo "should_run=$RESULT" >> $GITHUB_OUTPUT

      - name: Set up Python 3.11
        if: steps.besttime.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system fonts
        if: steps.besttime.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.besttime.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Restore credentials
        if: steps.besttime.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN }}' > youtube_token.json

      - name: Run pipeline
        if: steps.besttime.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          python main.py --run-now 2>&1 | tee pipeline.log

      - name: Save debug info to state
        if: always() && (steps.besttime.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p state
          tail -n 200 pipeline.log > state/last_run_log.txt || true
          cp output/*/result.json state/last_result.json 2>/dev/null || true

      - name: Commit updated history
        if: always() && (steps.besttime.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "chore: update post history [skip ci]"
            git push
          fi

      - name: Upload result as artifact
        if: always() && (steps.besttime.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: short-output-${{ github.run_number }}
          path: |
            output/**/result.json
            output/**/seo.json
            output/**/script.json
            pipeline.log
          retention-days: 30
